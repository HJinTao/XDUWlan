[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xduwlan"
version = "0.1.0"
description = "西安电子科技大学校园网一次认证恢复工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["keyring>=25,<26", "tomli>=2,<3; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
xduwlan = "xduwlan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xduwlan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
