<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XDUWlan 命令架构</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f7f8fa, #111418);
      --panel: light-dark(#ffffff, #1a1f26);
      --soft: light-dark(#eef3f8, #212a34);
      --text: light-dark(#17202a, #eef3f7);
      --muted: light-dark(#586574, #aab5c0);
      --border: light-dark(#d7dee6, #36414d);
      --accent: light-dark(#185fa5, #78b8f4);
      --accent-soft: light-dark(#e6f1fb, #16344d);
      --ok: light-dark(#1c6b45, #72d7a3);
      --plan: light-dark(#81520d, #f1c36f);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(980px, calc(100% - 32px));
      margin: 32px auto;
      display: grid;
      gap: 20px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); }
    h2 { font-size: 1rem; font-weight: 600; }
    .intro { color: var(--muted); max-width: 72ch; }
    .commands {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
    }
    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }
    .summary p { color: var(--muted); margin-top: 4px; }
    .status {
      white-space: nowrap;
      font-size: .88rem;
      font-weight: 600;
      color: var(--plan);
    }
    .status[data-kind="implemented"] { color: var(--ok); }
    .flow { display: grid; gap: 8px; }
    .layer {
      display: grid;
      grid-template-columns: 42px minmax(130px, .55fr) minmax(0, 1.45fr);
      gap: 14px;
      align-items: center;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .number {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }
    .layer-name { display: grid; gap: 2px; }
    .layer-name span { color: var(--muted); font-size: .88rem; }
    .detail { display: grid; gap: 4px; }
    .detail p { color: var(--muted); }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .9em;
    }
    .arrow { text-align: center; color: var(--muted); }
    .boundary {
      padding: 14px 16px;
      border-left: 4px solid var(--accent);
      background: var(--soft);
    }
    .boundary p { color: var(--muted); margin-top: 4px; }
    @media (max-width: 650px) {
      main { width: min(100% - 20px, 980px); margin: 20px auto; }
      .summary { grid-template-columns: 1fr; }
      .layer { grid-template-columns: 36px 1fr; }
      .detail { grid-column: 2; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>XDUWlan 命令怎样穿过各层</h1>
      <p class="intro">选择命令查看分层职责。status、configure 与 login 已实现；Linux 生产认证恢复与离线测试均已验证。login 启动一次，按需认证并验证后退出。</p>
    </header>

    <nav class="commands" aria-label="选择命令">
      <button type="button" data-command="status" aria-pressed="true">status</button>
      <button type="button" data-command="configure" aria-pressed="false">configure</button>
      <button type="button" data-command="login" aria-pressed="false">login</button>
    </nav>

    <section class="summary" aria-live="polite">
      <div>
        <h2 data-title></h2>
        <p data-outcome></p>
      </div>
      <span class="status" data-status></span>
    </section>

    <section class="flow" aria-label="命令分层调用关系">
      <article class="layer">
        <span class="number">1</span>
        <div class="layer-name"><strong>CLI</strong><span>用户边界</span></div>
        <div class="detail"><strong data-layer-title="0"></strong><p data-layer-body="0"></p></div>
      </article>
      <div class="arrow" aria-hidden="true">调用 ↓　↑ 返回</div>
      <article class="layer">
        <span class="number">2</span>
        <div class="layer-name"><strong>应用服务</strong><span>流程编排</span></div>
        <div class="detail"><strong data-layer-title="1"></strong><p data-layer-body="1"></p></div>
      </article>
      <div class="arrow" aria-hidden="true">调用 ↓　↑ 返回</div>
      <article class="layer">
        <span class="number">3</span>
        <div class="layer-name"><strong>核心契约</strong><span>模型与端口</span></div>
        <div class="detail"><strong data-layer-title="2"></strong><p data-layer-body="2"></p></div>
      </article>
      <div class="arrow" aria-hidden="true">调用 ↓　↑ 返回</div>
      <article class="layer">
        <span class="number">4</span>
        <div class="layer-name"><strong>适配器</strong><span>技术实现</span></div>
        <div class="detail"><strong data-layer-title="3"></strong><p data-layer-body="3"></p></div>
      </article>
      <div class="arrow" aria-hidden="true">请求 ↓　↑ 响应</div>
      <article class="layer">
        <span class="number">5</span>
        <div class="layer-name"><strong>外部系统</strong><span>程序边界之外</span></div>
        <div class="detail"><strong data-layer-title="4"></strong><p data-layer-body="4"></p></div>
      </article>
    </section>

    <section class="boundary">
      <h2>阅读边界</h2>
      <p data-boundary></p>
    </section>
  </main>

  <script>
    const flows = {
      status: {
        state: "implemented",
        status: "已实现",
        title: "读取配置并完成一次网络状态探测",
        outcome: "返回 NetworkProbeResult，再输出中文状态、脱敏 JSON 或阶段调试信息。",
        boundary: "分类器识别可信空 POST 入口。HTTPS 失败时可用 HTTP 回退发现 Portal，HTTP 204 不会掩盖 HTTPS 失败。",
        layers: [
          ["解析并展示", "_handle_status() 处理 --config、--json、--debug 和退出码。"],
          ["编排探测", "DefaultNetworkProbe 按 DNS → TCP → HTTP 执行，并在阶段失败时提前返回。"],
          ["统一结果", "AppConfig、NetworkState、ProbeObservation 和 NetworkProbeResult 传递稳定数据。"],
          ["执行网络操作", "SystemDnsResolver、SystemTcpConnector、SystemHttpConnectivityChecker 连接系统网络接口。"],
          ["提供真实响应", "操作系统名称解析器、目标服务器、校园网 Portal 和互联网决定实际结果。"]
        ]
      },
      configure: {
        state: "implemented",
        status: "已实现",
        title: "把密码安全保存到系统凭据库",
        outcome: "通过交互输入收集凭据，并明确报告输入安全或凭据后端错误。",
        boundary: "自动化覆盖交互与安全错误；Linux 的 Secret Service 真实保存和读取已验证，自动测试仍只使用虚构凭据。",
        layers: [
          ["收集凭据", "_handle_configure() 使用普通账号输入和隐藏密码输入，并处理取消与安全失败。"],
          ["控制保存流程", "DefaultCredentialConfigurator 负责账号整理、空值校验和 CredentialStore 调用。"],
          ["声明凭据能力", "CredentialConfigurator 面向 CLI；Credentials 与 CredentialStore 隔离核心数据和外部存储。"],
          ["连接平台后端", "KeyringCredentialStore 使用固定键保存单条 JSON，并转换后端与损坏记录错误。"],
          ["长期保存密码", "Linux Secret Service 提供安全凭据存储。"]
        ]
      },
      login: {
        state: "implemented",
        status: "已实现 · Linux 受控实测通过",
        title: "启动后检查、按需认证、验证联网并退出",
        outcome: "DefaultLoginService 已接入探测、系统凭据库与 PortalClient；认证一次并独立验证，不进入周期循环。",
        boundary: "Linux 新 MAC 下完成 200 入口链、一次 HTTPS 认证与独立 HTTP/HTTPS 204 验证；凭据错误、IPv6 和双栈仍待真实验证。",
        layers: [
          ["发起登录", "CLI 展示认证结果和可行动的错误，不显示敏感请求。"],
          ["探测与认证", "已联网直接结束；PORTAL_REQUIRED 后先校验上下文再读取凭据，认证后探测，仅 ONLINE 报告恢复。"],
          ["传递稳定状态", "LoginState、LoginResult、PortalContext、PortalClient 与 PortalTransport 提供稳定契约。"],
          ["发送协议请求", "SrunPortalClient → SystemPortalTransport；protocol 纯函数用独立虚构向量验证编码。"],
          ["处理认证", "真实成功后 HTTP/HTTPS 都恢复 204，同 MAC 重连获得无感知放行。"]
        ]
      },
    };

    const buttons = document.querySelectorAll("[data-command]");
    const title = document.querySelector("[data-title]");
    const outcome = document.querySelector("[data-outcome]");
    const status = document.querySelector("[data-status]");
    const boundary = document.querySelector("[data-boundary]");

    function render(command) {
      const flow = flows[command];
      title.textContent = flow.title;
      outcome.textContent = flow.outcome;
      status.textContent = flow.status;
      status.dataset.kind = flow.state;
      boundary.textContent = flow.boundary;
      flow.layers.forEach((layer, index) => {
        document.querySelector('[data-layer-title="' + index + '"]').textContent = layer[0];
        document.querySelector('[data-layer-body="' + index + '"]').textContent = layer[1];
      });
      buttons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.command === command));
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.command));
    });
    render("status");
  </script>
</body>
</html>
