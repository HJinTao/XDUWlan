<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f7f8fa, #111418);
      --panel: light-dark(#ffffff, #1a1f26);
      --soft: light-dark(#eef3f8, #212a34);
      --text: light-dark(#17202a, #eef3f7);
      --muted: light-dark(#586574, #aab5c0);
      --border: light-dark(#d7dee6, #36414d);
      --accent: light-dark(#185fa5, #78b8f4);
      --accent-soft: light-dark(#e6f1fb, #16344d);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 32px auto;
      display: grid;
      gap: 20px;
    }
    h1, h2, h3, p, dl, dd { margin: 0; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); }
    h2 { font-size: 1.15rem; }
    h3 { font-size: .95rem; }
    .intro { color: var(--muted); max-width: 78ch; }
    .layout {
      display: grid;
      grid-template-columns: minmax(220px, .72fr) minmax(0, 2.28fr);
      gap: 20px;
      align-items: start;
    }
    .tree, .detail {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .tree { padding: 12px; display: grid; gap: 6px; }
    details { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    details:last-child { border-bottom: 0; }
    summary { padding: 7px 4px; font-weight: 600; }
    .files { display: grid; gap: 3px; }
    button {
      appearance: none;
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      padding: 7px 9px;
      text-align: left;
      font: inherit;
      overflow-wrap: anywhere;
    }
    button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .detail { padding: 18px; display: grid; gap: 18px; min-width: 0; }
    .heading { display: grid; gap: 8px; }
    .path {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: .86rem;
    }
    .purpose {
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      background: var(--soft);
    }
    .graph {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .column { display: grid; align-content: start; gap: 9px; min-width: 0; }
    .items { display: grid; gap: 8px; }
    .item {
      padding: 9px 10px;
      border-left: 3px solid var(--border);
      background: color-mix(in srgb, var(--soft) 72%, transparent);
    }
    .item strong { display: block; overflow-wrap: anywhere; }
    .item p { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
    .notes {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 14px;
    }
    dt { font-weight: 600; }
    dd { color: var(--muted); }
    @media (max-width: 820px) {
      main { width: min(100% - 20px, 1180px); margin: 20px auto; }
      .layout { grid-template-columns: 1fr; }
      .tree { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .tree, .graph { grid-template-columns: 1fr; }
      .notes { grid-template-columns: 1fr; gap: 3px; }
      dd + dt { margin-top: 8px; }
    }
  </style>
</head>

      </article>
    </div>
  </main>

    const tree = document.querySelector("[data-tree]");
    const allPaths = Object.values(groups).flat();

    Object.entries(groups).forEach(([groupName, paths]) => {
      const details = document.createElement("details");
      details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = groupName + " · " + paths.length;
      const list = document.createElement("div");
      list.className = "files";
      paths.forEach((path) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.path = path;
        button.textContent = path.split("/").at(-1);
        button.setAttribute("aria-pressed", "false");
        list.append(button);
      });
      details.append(summary, list);
      tree.append(details);
    });

    function renderItems(selector, values) {
      const container = document.querySelector(selector);
      container.replaceChildren();
      values.forEach(([name, detail]) => {
        const block = document.createElement("div");
        block.className = "item";
        const strong = document.createElement("strong");
        strong.textContent = name;
        const paragraph = document.createElement("p");
        paragraph.textContent = detail;
        block.append(strong, paragraph);
        container.append(block);
      });
    }

    function render(path) {
      const value = files[path];
      document.querySelector("[data-title]").textContent = value.title;
      document.querySelector("[data-path]").textContent = path;
      document.querySelector("[data-type]").textContent = value.type;
      document.querySelector("[data-state]").textContent = value.state;
      document.querySelector("[data-role]").textContent = value.role;
      document.querySelector("[data-boundary]").textContent = value.boundary;
      document.querySelector("[data-maintenance]").textContent = value.maintenance;
      renderItems("[data-depends]", value.depends);
      renderItems("[data-contains]", value.contains);
      renderItems("[data-affects]", value.affects);
      document.querySelectorAll("[data-path]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.path === path));
      });
    }

    document.querySelectorAll("[data-path]").forEach((button) => {
      button.addEventListener("click", () => render(button.dataset.path));
    });

    if (allPaths.some((path) => files[path] === undefined) || Object.keys(files).length !== allPaths.length) {
      throw new Error("文件树与详情数据不一致");
    }
    render("docs/current.md");
  </script>
