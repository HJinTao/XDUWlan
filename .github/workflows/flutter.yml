name: Flutter 离线测试与桌面构建

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: 安装固定 Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev libx11-dev libxi-dev
      - name: 获取应用依赖
        run: flutter pub get
      - name: 格式与静态检查
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
      - name: 执行虚构数据与本地服务测试
        run: flutter test
      - name: 验证 macOS 登录启动文件边界
        if: runner.os == 'macOS'
        run: bash test/native/run_login_agent_test.sh
      - name: 构建桌面应用
        run: flutter build ${{ matrix.target }} --release
      - name: 上传 Windows 构建产物
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: xduwlan-windows-${{ github.sha }}
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 30
      - name: 上传 macOS 构建产物
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: xduwlan-macos-${{ github.sha }}
          path: app/build/macos/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 30
      - name: 上传 Linux 构建产物
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: xduwlan-linux-${{ github.sha }}
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: xduwlan-windows-${{ github.sha }}
          path: release-inputs/windows
      - name: 下载 macOS 构建产物
        uses: actions/download-artifact@v4
        with:
          name: xduwlan-macos-${{ github.sha }}
          path: release-inputs/macos
      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: xduwlan-linux-${{ github.sha }}
          path: release-inputs/linux
      - name: 打包 Release 附件
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd release-inputs/windows && zip -qr "../../release-assets/xduwlan-${TAG}-windows.zip" .)
          (cd release-inputs/macos && zip -qr "../../release-assets/xduwlan-${TAG}-macos.zip" .)
          tar -czf "release-assets/xduwlan-${TAG}-linux.tar.gz" -C release-inputs/linux .
      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "XDUWlan $TAG" \
              --generate-notes
          fi
