name: 离线测试与安装验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装开发依赖
        run: python -m pip install ".[test]" build
      - name: 执行离线测试
        run: python -m pytest -q
      - name: 验证 CLI 入口
        run: |
          xduwlan --help
          xduwlan login --help
      - name: 构建发行包
        run: python -m build
